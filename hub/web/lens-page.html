<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ống kính</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:14px sans-serif;overflow:hidden}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#world{position:fixed;left:0;top:0;transform-origin:0 0;opacity:0;transition:opacity .12s;pointer-events:none}
#state{position:fixed;left:10px;top:10px;padding:3px 8px;background:#0009;border-radius:4px}
#hold{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:92px;height:92px;border-radius:50%;border:4px solid #e8d9d9;background:#7a142066;color:#fff;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
#hold.on{background:#c21f33;border-color:#fff}
#hold[hidden],#again[hidden]{display:none}
#again{position:fixed;right:10px;top:10px;padding:6px 10px;border:0;border-radius:4px;background:#0009;color:#ddd}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 28px;font-size:18px;border:0;border-radius:8px;background:#7a1420;color:#fff}
</style>
</head>
<body>
<video id="camera" playsinline muted autoplay></video>
<canvas id="world" width="640" height="360"></canvas>
<button id="start">Mở kênh</button>
<div id="overlay"><button id="hold" hidden>Giữ để soi</button><button id="again" hidden>Hiệu chỉnh lại</button><div id="state">Đang kết nối…</div></div>
<script src="anchor.js"></script>
<script src="xr.js"></script>
<script src="lens.js"></script>
</body>
</html>
